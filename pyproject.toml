[build-system]
requires = ["scikit-build-core>=0.11", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "osu-orz"
version = "0.1.1"
description = "Lossless compression for osu! replays with the ORZ format"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "extern/osu_replay_zip/LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "cmyui" }]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Archiving :: Compression",
]

[project.urls]
Source = "https://github.com/cmyui/osu-orz"
"ORZ format" = "https://github.com/rumoi/osu_replay_zip"

[project.optional-dependencies]
test = ["pytest"]

[tool.mypy]
strict = true
files = ["src/osu_orz", "tests"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
# one wheel for every CPython from 3.12 (stable ABI)
wheel.py-api = "cp312"
wheel.exclude = ["osu_orz/_core.cpp"]

[tool.cibuildwheel]
# one stable-ABI wheel per platform covers CPython 3.12 and newer
build = ["cp312-manylinux_x86_64", "cp312-manylinux_aarch64", "cp312-macosx_arm64"]
test-requires = ["pytest>=8"]
test-command = "python -m pytest {project}/tests"

[tool.cibuildwheel.macos]
# Apple's libc++ parses floats with std::from_chars, which the codec uses, from macOS 26 on
environment = { MACOSX_DEPLOYMENT_TARGET = "26.0" }
